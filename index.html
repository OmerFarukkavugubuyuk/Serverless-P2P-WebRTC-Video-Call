<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>P2P Şifreli Görüntülü Görüşme</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0e11;
      color: #fff;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    #remoteVideo {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      object-fit: contain;
      background: #0b0e11;
      z-index: 1;
    }

    #localVideo {
      position: fixed;
      bottom: calc(100px + env(safe-area-inset-bottom));
      right: 24px;
      width: 240px;
      height: 135px;
      object-fit: cover;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
      background: #161b22;
      z-index: 10;
      transform: scaleX(-1);
      transition: bottom 0.45s ease, width 0.3s ease, height 0.3s ease;
    }

    .top-header, .controls {
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    body.idle-ui .top-header {
      opacity: 0;
      transform: translate(-50%, -24px);
      pointer-events: none;
    }

    body.idle-ui .controls {
      opacity: 0;
      transform: translate(-50%, 24px);
      pointer-events: none;
    }

    body.idle-ui #localVideo {
      bottom: calc(20px + env(safe-area-inset-bottom));
    }

    .top-header {
      position: fixed;
      top: calc(20px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
      width: max-content;
      max-width: 92vw;
    }

    #statusBadge {
      background: rgba(17, 24, 39, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 13px;
      font-weight: 500;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
    .dot.ready { background: #10b981; }
    .dot.live { background: #22c55e; box-shadow: 0 0 8px #22c55e; }

    .controls {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 20;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
    }
    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .icon-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 18px;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.22); }
    .icon-btn.off { background: #ef4444; }

    .action-btn { padding: 12px 24px; border-radius: 999px; color: #fff; white-space: nowrap; }
    #callBtn { background: #2563eb; }
    #callBtn:hover:not(:disabled) { background: #1d4ed8; }
    #acceptBtn { background: #16a34a; display: none; animation: pulse 1.5s infinite; }
    #hangupBtn { background: #dc2626; display: none; }
    #hangupBtn:hover { background: #b91c1c; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.6); }
      70% { box-shadow: 0 0 0 12px rgba(22, 163, 74, 0); }
      100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
    }

    @media (max-width: 768px) {
      #localVideo {
        width: 105px;
        height: 150px;
        bottom: calc(92px + env(safe-area-inset-bottom));
        right: 16px;
        border-radius: 14px;
      }
      body.idle-ui #localVideo {
        bottom: calc(18px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div id="statusBadge">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Sunucuya bağlanılıyor...</span>
    </div>
  </div>

  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>

  <div class="controls">
    <button id="micBtn" class="icon-btn" title="Mikrofon" style="display:none;">🎤</button>
    <button id="camBtn" class="icon-btn" title="Kamera" style="display:none;">📷</button>
    <button id="switchCamBtn" class="icon-btn" title="Kamerayı Çevir" style="display:none;">🔄</button>
    <button id="callBtn" class="action-btn" disabled>Ara</button>
    <button id="acceptBtn" class="action-btn">Gelen Aramayı Kabul Et</button>
    <button id="hangupBtn" class="action-btn">Görüşmeyi Bitir</button>
  </div>

  <script>
    const SIGNALING_URL = window.location.origin.replace('http', 'ws');

    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const callBtn = document.getElementById('callBtn');
    const acceptBtn = document.getElementById('acceptBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const micBtn = document.getElementById('micBtn');
    const camBtn = document.getElementById('camBtn');
    const switchCamBtn = document.getElementById('switchCamBtn');
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');

    let ws;
    let pc;
    let localStream;
    let pendingOffer = null;
    let iceQueue = [];
    let isMicOn = true;
    let isCamOn = true;
    let currentFacingMode = 'user';
    let isCallLive = false;
    let idleTimer = null;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' }
      ],
      iceCandidatePoolSize: 10
    };

    function resetIdleTimer() {
      document.body.classList.remove('idle-ui');
      clearTimeout(idleTimer);
      if (isCallLive) {
        idleTimer = setTimeout(() => {
          document.body.classList.add('idle-ui');
        }, 3000);
      }
    }

    ['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach(evt => {
      window.addEventListener(evt, resetIdleTimer, { passive: true });
    });

    function setStatus(text, state = '') {
      statusText.textContent = text;
      statusDot.className = 'dot ' + state;
    }

    function connectSignaling() {
      ws = new WebSocket(SIGNALING_URL);

      ws.onopen = () => {
        setStatus('Bağlantıya hazır', 'ready');
        callBtn.disabled = false;
      };

      ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'offer') {
          pendingOffer = data.offer;
          setStatus('Gelen arama var...', 'ready');
          callBtn.style.display = 'none';
          acceptBtn.style.display = 'flex';
        } 
        else if (data.type === 'answer') {
          await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
          await flushIceQueue();
        } 
        else if (data.type === 'ice') {
          if (pc && pc.remoteDescription && pc.remoteDescription.type) {
            try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch (e) {}
          } else {
            iceQueue.push(data.candidate);
          }
        }
        else if (data.type === 'hangup') {
          resetCall();
        }
      };

      ws.onclose = () => {
        setStatus('Sunucu bağlantısı kesildi');
        callBtn.disabled = true;
      };
    }

    async function flushIceQueue() {
      while (iceQueue.length > 0) {
        const candidate = iceQueue.shift();
        try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {}
      }
    }

    async function getCameraStream(facing = 'user') {
      try {
        return await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: facing,
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: {
            echoCancellation: true,
            noiseSuppression: true
          }
        });
      } catch (e) {
        return await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      }
    }

    async function setupMediaAndPeer() {
      try {
        localStream = await getCameraStream(currentFacingMode);
      } catch (err) {
        setStatus('Kamera veya mikrofon izni verilmedi!');
        throw err;
      }

      localVideo.srcObject = localStream;
      localVideo.play().catch(() => {});

      micBtn.style.display = 'flex';
      camBtn.style.display = 'flex';
      switchCamBtn.style.display = 'flex';

      pc = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      pc.onicecandidate = (event) => {
        if (event.candidate && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'ice', candidate: event.candidate }));
        }
      };

      pc.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
        } else {
          const stream = new MediaStream();
          stream.addTrack(event.track);
          remoteVideo.srcObject = stream;
        }
        remoteVideo.play().catch(() => {});
      };

      pc.oniceconnectionstatechange = () => {
        const state = pc.iceConnectionState;
        if (state === 'connected' || state === 'completed') {
          setStatus('P2P Şifreli Görüşme Aktif', 'live');
          isCallLive = true;
          resetIdleTimer();
        } else if (state === 'checking') {
          setStatus('Ağ yolu doğrulanıyor...', 'ready');
        } else if (state === 'failed') {
          setStatus('Ağ duvarı P2P bağlantıyı engelledi');
        } else if (state === 'disconnected') {
          resetCall();
        }
      };
    }

    switchCamBtn.onclick = async () => {
      if (!localStream || !pc) return;
      currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
      localVideo.style.transform = currentFacingMode === 'user' ? 'scaleX(-1)' : 'scaleX(1)';

      try {
        const newStream = await getCameraStream(currentFacingMode);
        const newVideoTrack = newStream.getVideoTracks()[0];
        const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender && newVideoTrack) {
          await sender.replaceTrack(newVideoTrack);
        }
        localStream.getVideoTracks().forEach(t => t.stop());
        localStream.removeTrack(localStream.getVideoTracks()[0]);
        localStream.addTrack(newVideoTrack);
        localVideo.srcObject = localStream;
      } catch (e) {
        currentFacingMode = 'user';
      }
    };

    callBtn.onclick = async () => {
      callBtn.disabled = true;
      setStatus('Aranıyor...', 'ready');
      try {
        await setupMediaAndPeer();
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        ws.send(JSON.stringify({ type: 'offer', offer }));
        callBtn.style.display = 'none';
        hangupBtn.style.display = 'flex';
      } catch (e) {
        callBtn.disabled = false;
      }
    };

    acceptBtn.onclick = async () => {
      acceptBtn.style.display = 'none';
      hangupBtn.style.display = 'flex';
      setStatus('Bağlanıyor...', 'ready');
      try {
        await setupMediaAndPeer();
        await pc.setRemoteDescription(new RTCSessionDescription(pendingOffer));
        await flushIceQueue();
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'answer', answer }));
      } catch (e) {
        resetCall();
      }
    };

    micBtn.onclick = () => {
      if (!localStream) return;
      isMicOn = !isMicOn;
      localStream.getAudioTracks().forEach(t => t.enabled = isMicOn);
      micBtn.classList.toggle('off', !isMicOn);
      micBtn.textContent = isMicOn ? '🎤' : '🔇';
    };

    camBtn.onclick = () => {
      if (!localStream) return;
      isCamOn = !isCamOn;
      localStream.getVideoTracks().forEach(t => t.enabled = isCamOn);
      camBtn.classList.toggle('off', !isCamOn);
      camBtn.textContent = isCamOn ? '📷' : '🚫';
    };

    hangupBtn.onclick = () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'hangup' }));
      }
      resetCall();
    };

    function resetCall() {
      isCallLive = false;
      clearTimeout(idleTimer);
      document.body.classList.remove('idle-ui');
      if (pc) { pc.close(); pc = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      localVideo.srcObject = null;
      remoteVideo.srcObject = null;
      pendingOffer = null;
      iceQueue = [];
      isMicOn = true;
      isCamOn = true;
      currentFacingMode = 'user';
      localVideo.style.transform = 'scaleX(-1)';
      micBtn.style.display = 'none';
      micBtn.classList.remove('off');
      micBtn.textContent = '🎤';
      camBtn.style.display = 'none';
      camBtn.classList.remove('off');
      camBtn.textContent = '📷';
      switchCamBtn.style.display = 'none';
      callBtn.style.display = 'flex';
      callBtn.disabled = false;
      acceptBtn.style.display = 'none';
      hangupBtn.style.display = 'none';
      setStatus('Bağlantıya hazır', 'ready');
    }

    connectSignaling();
  </script>
</body>
</html>
